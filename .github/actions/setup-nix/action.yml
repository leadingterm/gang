name: Set up Nix
description: >-
  Enable unprivileged user namespaces on Linux, optionally enable KVM on Linux x86-64,
  and install and cache Nix for the repository's devShell.
inputs:
  path:
    description: Path to the Gang checkout containing the flake.
    required: false
    default: '.'
  shell:
    description: Named devShell to cache; empty selects the default devShell.
    required: false
    default: ''
  kvm:
    description: Enable KVM access for VM builds on Linux x86-64.
    required: false
    default: 'false'
  cache-save:
    description: Save the shared Nix cache on eligible pull requests and default-branch pushes.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Allow unprivileged user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Enable KVM access
      if: inputs.kvm == 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        if [[ ! -e /dev/kvm ]]; then
          echo "::error::Linux runner is missing /dev/kvm, required for VM builds"
          exit 1
        fi
        sudo -n chmod 0666 /dev/kvm
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        enable_kvm: ${{ inputs.kvm }}
    # Share the default x86 store across CI jobs; deploy shells use their own namespace.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      if: runner.os == 'Linux' && github.job != 'cross' && (runner.arch == 'X64' || (runner.arch == 'ARM64' && inputs.shell == 'deploy'))
      with:
        primary-key: nix-${{ inputs.shell != '' && format('{0}-', inputs.shell) || '' }}v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/flake.lock', inputs.path), format('{0}/flake.nix', inputs.path), format('{0}/MODULE.bazel', inputs.path), format('{0}/tools/darwin-check.sh', inputs.path), format('{0}/.github/actions/setup-nix/action.yml', inputs.path)) }}-${{ hashFiles(format('{0}/infra/nixos/**/*.nix', inputs.path), format('{0}/configs/gang.aws.toml', inputs.path), format('{0}/infra/terraform/modules/network/ports.json', inputs.path)) }}
        restore-prefixes-first-match: |
          nix-${{ inputs.shell != '' && format('{0}-', inputs.shell) || '' }}v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/flake.lock', inputs.path), format('{0}/flake.nix', inputs.path), format('{0}/MODULE.bazel', inputs.path), format('{0}/tools/darwin-check.sh', inputs.path), format('{0}/.github/actions/setup-nix/action.yml', inputs.path)) }}-
          nix-${{ inputs.shell != '' && format('{0}-', inputs.shell) || '' }}v3-${{ runner.os }}-${{ runner.arch }}-
        save: ${{ inputs.cache-save == 'true' && runner.os == 'Linux' && github.job != 'cross' && (runner.arch == 'X64' || (runner.arch == 'ARM64' && inputs.shell == 'deploy')) && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
        # Upstream bounds GC's live-store target, not the compressed /nix archive size.
        # Rooted closures can exceed it: v7 has no hard store/archive cap and must preserve VM roots.
        gc-max-store-size: 1G
    # Root the devShell before post-job GC. VM result links can root their closures separately.
    - name: Root shared devShell for cache
      if: runner.os == 'Linux' && github.job != 'cross' && (runner.arch == 'X64' || (runner.arch == 'ARM64' && inputs.shell == 'deploy')) && inputs.cache-save == 'true'
      shell: bash
      env:
        FLAKE: ${{ format('./{0}{1}', inputs.path, inputs.shell != '' && format('#{0}', inputs.shell) || '') }}
      run: nix develop "$FLAKE" --profile "$RUNNER_TEMP/ci-devshell-profile" -c true
    - name: Verify KVM access and Nix system feature
      if: inputs.kvm == 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
          echo "::error::Linux runner cannot read and write /dev/kvm"
          exit 1
        fi
        features="$(nix config show system-features)"
        if [[ ! " $features " =~ [[:space:]]kvm[[:space:]] ]]; then
          echo "::error::Nix system-features does not include kvm: $features"
          exit 1
        fi
