name: Upload gang
description: >-
  Upload the gang binary the job's Bazel commands built as the workflow artifact gang-<target>, the
  asset the release publishes (docs/SPECIFICATION.md 7.2).
inputs:
  target:
    description: Rust target triple of the binary; the artifact is named gang-<target>.
    required: true
runs:
  using: composite
  steps:
    - name: Collect gang
      shell: bash
      env:
        ASSET: ${{ runner.temp }}/dist/gang-${{ inputs.target }}
      run: |
        built="$(nix develop -c bazel cquery --output=files //:gang)"
        mkdir -p "$(dirname "$ASSET")"
        cp "$built" "$ASSET"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gang-${{ inputs.target }}
        path: ${{ runner.temp }}/dist/gang-${{ inputs.target }}
        if-no-files-found: error
