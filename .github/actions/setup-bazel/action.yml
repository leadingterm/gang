name: Set up Bazel
description: >-
  Configure Bazel for this runner and restore the disk and repository archive caches that
  .github/actions/save-bazel-cache saved (docs/SPECIFICATION.md 7.1). Runs after
  .github/actions/setup-nix.
runs:
  using: composite
  steps:
    # Each default-branch push saves a snapshot per job, platform, input set, and run attempt.
    - name: Name the Bazel caches
      id: name
      shell: bash
      env:
        PLATFORM: bazel-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
        INPUTS: ${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'flake.lock') }}
        RUN: default-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        {
          echo "BAZEL_DISK_CACHE=$HOME/.cache/bazel-disk"
          echo "BAZEL_REPOSITORY_CACHE=$HOME/.cache/bazel-repository"
          echo "BAZEL_DISK_CACHE_KEY=$PLATFORM-$INPUTS-$RUN"
          echo "BAZEL_DISK_CACHE_EPOCH=$RUNNER_TEMP/bazel-disk-cache-epoch"
        } >> "$GITHUB_ENV"
        {
          echo "platform=$PLATFORM-"
          echo "inputs=$PLATFORM-$INPUTS-"
        } >> "$GITHUB_OUTPUT"
    # The runner's home rc, read by every Bazel command of the job, nested ones included. Actions run
    # without HOME, so zig's default cache /tmp/zig-cache would live in the sandbox's per-action /tmp
    # and every C compile and link would rebuild the C runtimes: zig gets one persistent directory,
    # writable inside the sandbox.
    - name: Configure Bazel for this runner
      shell: bash
      run: |
        zig_cache=/var/tmp/zig-cache
        mkdir -p "$zig_cache"
        cat > "$HOME/.bazelrc" <<EOF
        build --config=ci
        build --disk_cache=$BAZEL_DISK_CACHE
        build --repository_cache=$BAZEL_REPOSITORY_CACHE
        build --repo_env=HERMETIC_CC_TOOLCHAIN_CACHE_PREFIX=$zig_cache
        build --sandbox_writable_path=$zig_cache
        EOF
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: restore
      with:
        path: |
          ${{ env.BAZEL_DISK_CACHE }}
          ${{ env.BAZEL_REPOSITORY_CACHE }}/content_addressable
        key: ${{ env.BAZEL_DISK_CACHE_KEY }}
        restore-keys: |
          ${{ steps.name.outputs.inputs }}
          ${{ steps.name.outputs.platform }}
    # Only default-branch pushes save; pull requests can restore but cannot write snapshots.
    # Bazel refreshes disk entries and archive payload mtimes on use, allowing successful jobs
    # to save their working sets while retaining the markers of used archives.
    - name: Mark the start of the build
      shell: bash
      env:
        SAVE: ${{ steps.restore.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        echo "BAZEL_DISK_CACHE_SAVE=$SAVE" >> "$GITHUB_ENV"
        touch "$BAZEL_DISK_CACHE_EPOCH"
