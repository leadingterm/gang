# Publishes every pushed v* tag as a GitHub release: CI's binaries, each architecture's disk image,
# and its public AMI in every image region (gang-amis.json). Nothing is compiled here.
# Dispatch on a branch or main is a dry run without AWS; dispatch on a v* tag backfills retained AMIs.

name: Release

on:
  push:
    tags: ["v*"]
  # A pushed tag releases only a commit whose dry run passed.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Only a pushed v* tag publishes a release.
  PUBLISH: ${{ github.event_name == 'push' }}
  BACKFILL: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    shell: bash

jobs:
  # gh and sha256sum are the runner's own: this job checks out nothing and installs no Nix.
  locate:
    if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      dry-run-id: ${{ steps.dry-run.outputs.run-id }}
    steps:
      - name: Require a passed dry run of the tagged commit
        id: dry-run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs="$(gh api --paginate "repos/$GH_REPO/actions/workflows/release.yml/runs?head_sha=$SHA&event=workflow_dispatch" \
            | jq -rs '[.[].workflow_runs[] | select(.conclusion == "success") | .id] | .[]')"
          dry_run=""
          for candidate in $runs; do
            imaged="$(gh api --paginate "repos/$GH_REPO/actions/runs/$candidate/jobs" \
              | jq -s '[.[].jobs[] | select((.name | startswith("images (")) and .conclusion == "success")] | length')"
            if [[ "$imaged" == 2 ]]; then
              dry_run="$candidate"
              break
            fi
          done
          if [[ -z "$dry_run" ]]; then
            echo "::error::no passed dry run of $SHA built both images: dispatch this workflow on the commit (gh workflow run release.yml --ref main) and tag once it has passed" >&2
            exit 1
          fi
          echo "dry run $dry_run of $SHA passed"
          echo "run-id=$dry_run" >> "$GITHUB_OUTPUT"
      - name: Find the CI run to release
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          run_id="$(gh api --paginate "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA" \
            | jq -rs --arg event "$EVENT" '[.[].workflow_runs[] | select(.conclusion == "success" and ((.event == "push" and .head_branch == "main") or ($event == "workflow_dispatch" and .event == "pull_request")))] | .[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::no eligible successful CI run of $SHA" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  # Build each architecture's disk image from the binaries CI tested.
  images:
    needs: locate
    if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SYSTEM: ${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-${{ matrix.arch }}-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # Each image build boots the image under UEFI firmware: KVM where the runner has it (x86_64), qemu's TCG fallback otherwise (aarch64).
      - name: Build the images
        env:
          NIX_CONFIG: extra-system-features = kvm
        run: |
          install -D -m 0755 "staged/gang-${{ matrix.arch }}-unknown-linux-musl" "gang-binaries/$SYSTEM/gang"
          mkdir dist
          nix build -L --override-input gang-binaries "path:$PWD/gang-binaries" ".#packages.$SYSTEM.image" --out-link image
          # The second build runs against a store whose identical files are hard-linked, as on a host with auto-optimise-store, so a disk that carried the builder's store layout differs.
          nix store optimise
          # Nix builds the disk a second time and fails if the bytes differ.
          nix build -L --rebuild --override-input gang-binaries "path:$PWD/gang-binaries" ".#packages.$SYSTEM.image.disk" --no-link
      - name: Compress the images
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        run: |
          # The image output links its disk; zstd skips a symbolic link, so it gets the store file itself.
          zstd -19 --long=27 -T0 -q "$(realpath image/*.raw)" -o "dist/gang-image-${{ matrix.arch }}.raw.zst"
          cp image/nix-support/image-info.json "dist/gang-image-${{ matrix.arch }}.json"
          (cd dist && sha256sum gang-*) >"images-${{ matrix.arch }}.sha256"
          (cd dist && wc -c gang-* && cat ../"images-${{ matrix.arch }}.sha256") >>"$GITHUB_STEP_SUMMARY"
      # A release stores only images that its dry run, built on another runner, reproduced byte for byte.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISH == 'true'
        with:
          name: images-${{ matrix.arch }}
          path: dry-run
          run-id: ${{ needs.locate.outputs.dry-run-id }}
          github-token: ${{ github.token }}
      - name: Match the dry run's images
        if: env.PUBLISH == 'true'
        env:
          DRY_RUN: ${{ needs.locate.outputs.dry-run-id }}
        run: |
          if ! diff "dry-run/images-${{ matrix.arch }}.sha256" "images-${{ matrix.arch }}.sha256"; then
            echo "::error::the images differ from those of dry run $DRY_RUN: the image build is not reproducible" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: image-${{ matrix.arch }}
          path: |
            dist/gang-image-${{ matrix.arch }}.raw.zst
            dist/gang-image-${{ matrix.arch }}.json
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}
          path: images-${{ matrix.arch }}.sha256

  amis:
    needs: [locate, images]
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.locate.result == 'success' && needs.images.result == 'success') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.BACKFILL != 'true'
        with:
          name: gang-aarch64-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download and verify the backfill binary
        if: env.BACKFILL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p staged
          cd staged
          gh release download "$TAG" --pattern gang-aarch64-unknown-linux-musl --pattern SHA256SUMS
          sha256sum --check --ignore-missing --strict SHA256SUMS
          gh attestation verify gang-aarch64-unknown-linux-musl --repo "$GH_REPO" \
            --cert-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com --source-ref "refs/tags/$TAG"
      - run: chmod +x staged/gang-aarch64-unknown-linux-musl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISH == 'true'
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Calculate image identities
        if: env.PUBLISH == 'true'
        run: |
          echo "IMAGE_SHA256_x86_64=$(sha256sum images/gang-image-x86_64.raw.zst | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "IMAGE_SHA256_aarch64=$(sha256sum images/gang-image-aarch64.raw.zst | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.IMAGE_PUBLISH_ROLE }}
          aws-region: ${{ vars.IMAGE_HOME_REGION }}
      - name: Converge public AMIs
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        env:
          GANG: ${{ github.workspace }}/staged/gang-aarch64-unknown-linux-musl
          IMAGE_HOME_REGION: ${{ vars.IMAGE_HOME_REGION }}
          IMAGE_REGIONS: ${{ vars.IMAGE_REGIONS }}
          RELEASE: ${{ github.event_name == 'push' && github.ref_name || '' }}
          IMAGES_DIR: ${{ github.event_name == 'push' && 'images' || '' }}
        run: infra/scripts/publish-amis.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: gang-amis
          path: gang-amis.json
          retention-days: 1

  publish:
    needs: [locate, images, amis]
    if: ${{ github.event_name == 'push' && !cancelled() && needs.locate.result == 'success' && needs.images.result == 'success' && needs.amis.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gang-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-amis
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum gang-* >SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.locate.outputs.run-id }}
        run: |
          notes="Binaries built and tested by CI run $RUN_URL. Public AMIs of each architecture in every image region: gang-amis.json."
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" \
            --generate-notes "${prerelease[@]}" gang-* SHA256SUMS
