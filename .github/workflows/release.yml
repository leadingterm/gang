# Publishes every pushed v* tag as a GitHub release: CI's binaries, each architecture's disk image,
# and its deployment-ready public AMIs (gang-amis.json). Catalog copies converge independently.
# Dispatch on main or an eligible merged release is a dry run without AWS; dispatch on a v* tag backfills retained AMIs.

name: Release

on:
  push:
    tags: ["v*"]
  # Dispatches do not publish a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Only a pushed v* tag publishes a release.
  PUBLISH: ${{ github.event_name == 'push' }}
  BACKFILL: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
  AMI_PUBLISHER_ROLE: arn:aws:iam::072320588884:role/LTPublicArtifactsGangPublisher
  AMI_CONFIG_REGION: eu-west-2

defaults:
  run:
    shell: bash

jobs:
  locate:
    if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release changelog
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ runner.temp }}/validated-changelog.md
          SECTION: ${{ runner.temp }}/validated-section.md
        run: |
          python3 tools/changelog.py --repo . render --ref "$RELEASE_COMMIT" \
            --tag "$TAG" --output "$CHANGELOG" --section-output "$SECTION"
      - name: Find the CI run to release
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 tools/queue_ci.py --sha "$SHA" --github-output "$GITHUB_OUTPUT"

  # Build each architecture's disk image from the binaries CI tested.
  images:
    needs: locate
    if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SYSTEM: ${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          kvm: ${{ matrix.arch == 'x86_64' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-${{ matrix.arch }}-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # Each image build boots the image under UEFI firmware: KVM where the runner has it (x86_64), qemu's TCG fallback otherwise (aarch64).
      - name: Build the images
        env:
          NIX_CONFIG: extra-system-features = kvm
        run: |
          install -D -m 0755 "staged/gang-${{ matrix.arch }}-unknown-linux-musl" "gang-binaries/$SYSTEM/gang"
          mkdir -p dist
          nix build -L --override-input gang-binaries "path:$PWD/gang-binaries" ".#packages.$SYSTEM.image" --out-link image
      - name: Compress the images
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        run: |
          # The image output links its disk; zstd skips a symbolic link, so it gets the store file itself.
          zstd -9 -T0 -q "$(realpath image/*.raw)" -o "dist/gang-image-${{ matrix.arch }}.raw.zst"
          cp image/nix-support/image-info.json "dist/gang-image-${{ matrix.arch }}.json"
          jq -e '.action_environment | strings | test("^[0-9a-f]{64}\\z")' "dist/gang-image-${{ matrix.arch }}.json" >/dev/null
      - name: Record image checksums
        run: |
          (cd dist && sha256sum gang-*) >"images-${{ matrix.arch }}.sha256"
          (cd dist && wc -c gang-* && cat ../"images-${{ matrix.arch }}.sha256") >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: image-${{ matrix.arch }}
          path: |
            dist/gang-image-${{ matrix.arch }}.raw.zst
            dist/gang-image-${{ matrix.arch }}.json
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}
          path: images-${{ matrix.arch }}.sha256

  controller_image:
    needs: locate
    if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-aarch64-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Build controller image
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        run: |
          install -D -m 0755 staged/gang-aarch64-unknown-linux-musl gang-binaries/aarch64-linux/gang
          nix build -L --no-write-lock-file --override-input gang-binaries "path:$PWD/gang-binaries" .#packages.x86_64-linux.controller-oci --out-link controller-image
          cp -L controller-image gang-controller.oci.tar
          digest="$(tar -xOf gang-controller.oci.tar index.json | jq -er '.manifests | select(length == 1) | .[0].digest | strings | select(test("^sha256:[0-9a-f]{64}$"))')"
          [[ "$(tar -xOf gang-controller.oci.tar "blobs/sha256/${digest#sha256:}" | sha256sum | cut -d' ' -f1)" == "${digest#sha256:}" ]]
          jq -n --arg digest "$digest" --arg asset gang-controller.oci.tar '{controller_image_digest: $digest, controller_image_asset: $asset}' > gang-controller.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: gang-controller
          path: |
            gang-controller.oci.tar
            gang-controller.json
          retention-days: 1
          compression-level: 0

  verify_reproducibility:
    needs: [locate, images, controller_image]
    if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: x86_64
            arch: x86_64
            runner: ubuntu-24.04
          - kind: aarch64
            arch: aarch64
            runner: ubuntu-24.04-arm
          - kind: controller
            arch: aarch64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          kvm: ${{ matrix.kind == 'x86_64' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-${{ matrix.arch }}-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify reproducibility
        env:
          ARCH: ${{ matrix.arch }}
          KIND: ${{ matrix.kind }}
          NIX_CONFIG: extra-system-features = kvm
        run: |
          install -D -m 0755 "staged/gang-$ARCH-unknown-linux-musl" "gang-binaries/$ARCH-linux/gang"
          if [[ "$KIND" == controller ]]; then
            target=.#packages.x86_64-linux.controller-oci
          else
            target=".#packages.$ARCH-linux.image.disk"
          fi
          nix build -L --override-input gang-binaries "path:$PWD/gang-binaries" "$target" --no-link
          nix store optimise
          nix build -L --rebuild --override-input gang-binaries "path:$PWD/gang-binaries" "$target" --no-link

  amis:
    needs: [locate, images]
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.locate.result == 'success' && needs.images.result == 'success') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    outputs:
      home-region: ${{ steps.config.outputs.home-region }}
      image-regions: ${{ steps.config.outputs.image-regions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.BACKFILL != 'true'
        with:
          name: gang-aarch64-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Download and verify the backfill binary
        if: env.BACKFILL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p staged
          cd staged
          gh release download "$TAG" --pattern gang-aarch64-unknown-linux-musl --pattern SHA256SUMS
          sha256sum --check --ignore-missing --strict SHA256SUMS
          gh attestation verify gang-aarch64-unknown-linux-musl --repo "$GH_REPO" \
            --cert-identity "https://github.com/$GH_REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com --source-ref "refs/tags/$TAG"
      - run: chmod +x staged/gang-aarch64-unknown-linux-musl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISH == 'true'
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Calculate image identities
        if: env.PUBLISH == 'true'
        run: |
          echo "IMAGE_SHA256_x86_64=$(sha256sum images/gang-image-x86_64.raw.zst | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "IMAGE_SHA256_aarch64=$(sha256sum images/gang-image-aarch64.raw.zst | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AMI_PUBLISHER_ROLE }}
          aws-region: ${{ env.AMI_CONFIG_REGION }}
      - name: Read public AMI configuration
        id: config
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        run: |
          config="$(aws ssm get-parameter --region "$AMI_CONFIG_REGION" --name /leadingterm/public-artifacts/gang --query Parameter.Value --output text)"
          resolved="$(printf '%s' "$config" | jq -er -s '
            if length == 1 and (.[0] | type == "object") then .[0]
            else error("invalid public AMI configuration") end
            | if (.home_region | type == "string" and test("^[a-z0-9-]+\\z"))
              and (.image_regions | type == "array" and length > 0
                and all(.[]; type == "string" and test("^[a-z0-9-]+\\z")))
              then "IMAGE_HOME_REGION=\(.home_region)\nIMAGE_REGIONS=\(.image_regions | join(" "))"
              else error("invalid public AMI configuration") end
          ')"
          printf '%s\n' "$resolved" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              IMAGE_HOME_REGION) printf 'home-region=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              IMAGE_REGIONS) printf 'image-regions=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done <<< "$resolved"
      - name: Converge public AMIs
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        env:
          GANG: ${{ github.workspace }}/staged/gang-aarch64-unknown-linux-musl
          RELEASE: ${{ github.event_name == 'push' && github.ref_name || '' }}
          IMAGES_DIR: ${{ github.event_name == 'push' && 'images' || '' }}
          PUBLICATION_SCOPE: ${{ github.event_name == 'push' && 'release' || 'catalog' }}
          AMI_DEPLOY_REGIONS: ${{ vars.AMI_DEPLOY_REGIONS }}
        run: infra/scripts/publish-amis.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: gang-amis
          path: gang-amis.json
          retention-days: 1

  # Full catalog convergence is independent of the immutable release manifest.
  amiscopies:
    needs: [locate, amis]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-aarch64-unknown-linux-musl
          path: staged
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: chmod +x staged/gang-aarch64-unknown-linux-musl
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AMI_PUBLISHER_ROLE }}
          aws-region: ${{ env.AMI_CONFIG_REGION }}
      - name: Converge the public AMI catalog
        shell: nix develop .#release -c bash --noprofile --norc -euo pipefail {0}
        env:
          GANG: ${{ github.workspace }}/staged/gang-aarch64-unknown-linux-musl
          IMAGE_HOME_REGION: ${{ needs.amis.outputs.home-region }}
          IMAGE_REGIONS: ${{ needs.amis.outputs.image-regions }}
          PUBLICATION_SCOPE: catalog
          RELEASE: ''
        run: infra/scripts/publish-amis.sh

  publish:
    needs: [locate, images, amis, controller_image]
    if: ${{ github.event_name == 'push' && !cancelled() && needs.locate.result == 'success' && needs.images.result == 'success' && needs.amis.result == 'success' && needs.controller_image.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .source
          fetch-depth: 0
          persist-credentials: false
      - name: Select available CI binaries
        id: binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.locate.outputs.run-id }}
        run: |
          ids="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq -rs '
              if length == 0 or any(.[]; (.artifacts | type) != "array") then error("invalid artifacts") else
                [.[].artifacts[] | select(.expired == false and
                  (.name == "gang-x86_64-unknown-linux-musl" or .name == "gang-aarch64-unknown-linux-musl" or .name == "gang-aarch64-apple-darwin"))] as $binaries
                | if ([$binaries[] | select(.name == "gang-x86_64-unknown-linux-musl")] | length) != 1
                  or ([$binaries[] | select(.name == "gang-aarch64-unknown-linux-musl")] | length) != 1
                  or ([$binaries[] | select(.name == "gang-aarch64-apple-darwin")] | length) > 1
                  or any($binaries[]; (.id | type) != "number" or .id <= 0 or .id != (.id | floor))
                  then error("missing or invalid CI binary artifacts")
                  else [$binaries[].id | tostring] | join(",") end
              end')"
          echo "artifact-ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.binaries.outputs.artifact-ids }}
          path: dist
          merge-multiple: true
          run-id: ${{ needs.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-amis
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-controller
          path: dist
      - name: Render changelog
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          SECTION: ${{ runner.temp }}/release-section.md
        run: |
          python3 .source/tools/changelog.py --repo .source render --ref "$RELEASE_COMMIT" \
            --tag "$TAG" --output dist/CHANGELOG.md --section-output "$SECTION"
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum gang-* CHANGELOG.md >SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SECTION: ${{ runner.temp }}/release-section.md
          NOTES: ${{ runner.temp }}/release-notes.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.locate.outputs.run-id }}
        run: |
          cat "$SECTION" > "$NOTES"
          printf '\n\n%s\n' \
            "Binaries built and tested by CI run $RUN_URL. Primary public AMIs of each architecture: gang-amis.json." >> "$NOTES"
          if [[ ! -f gang-aarch64-apple-darwin ]]; then
            printf '\n%s\n' "The macOS binary is not included in this release." >> "$NOTES"
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" \
            --generate-notes "${prerelease[@]}" gang-* CHANGELOG.md SHA256SUMS
