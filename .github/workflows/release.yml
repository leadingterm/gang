# Publishes the gang binaries of every pushed v* tag as a GitHub release (docs/SPECIFICATION.md 7.2):
# the binaries CI built and tested for the tagged commit on main. Nothing is compiled here.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # gh and sha256sum are the runner's own: this job checks out nothing and installs no Nix.
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find the CI run of the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run_id="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")][0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::no successful CI run of $SHA pushed to main: tag a commit of main once its CI run has passed" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gang-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.ci.outputs.run-id }}
        run: |
          sha256sum gang-* >SHA256SUMS
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "Binaries built and tested by CI run $RUN_URL." \
            --generate-notes "${prerelease[@]}" gang-* SHA256SUMS
