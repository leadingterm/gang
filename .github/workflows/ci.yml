name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -euo pipefail {0}

jobs:
  # Existing required check IDs stay stable; aggregators require their leaf jobs to succeed.
  # The final required check covers every job, including those stable contexts.
  # Long Bazel step timeouts leave cache save room.
  lint-x86-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Lint
        run: tools/lint.sh --nix-vm

  lint-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      # The portable checks include macOS Clippy of every Cargo target (docs/SPECIFICATION.md §7).
      - name: Lint
        run: tools/lint.sh --portable

  lint:
    needs: [lint-arm64, lint-x86-vm]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require lint jobs to succeed
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success
          done

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Test
        timeout-minutes: 55
        run: bazel test //...
      - uses: ./.github/actions/upload-gang
        with:
          target: x86_64-unknown-linux-musl
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  cross:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Cross-build gang
        timeout-minutes: 45
        run: bazel build --platforms=@zig_sdk//libc_aware/platform:linux_amd64_musl //:gang
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  macos:
    runs-on: macos-15
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Build
        timeout-minutes: 130
        run: bazel build //...
      - uses: ./.github/actions/upload-gang
        with:
          target: aarch64-apple-darwin
      - name: Test the macOS-specific crates
        timeout-minutes: 10
        run: bazel test //crates/gang-exec/... //crates/gang-noop/... //crates/gang-e2e:gang_e2e_unit_test
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Check BUILD files are in sync
        run: bazel run //:gazelle.check
      - name: Test
        timeout-minutes: 60
        run: bazel test //...
      - uses: ./.github/actions/upload-gang
        with:
          target: aarch64-unknown-linux-musl
      - name: Collect the e2e harness
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cp $(bazel cquery --output=files //crates/gang-e2e:bundle) "$RUNNER_TEMP/e2e/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-harness-aarch64
          path: ${{ runner.temp }}/e2e
          if-no-files-found: error
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  e2e-gate-1:
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    # The script bounds the gate itself; this timeout is only an outer backstop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-e2e
        with:
          args: --gate 1

  e2e-gate-2-shard-1:
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-e2e
        with:
          args: --gate 2 --additions --shard 1/2

  e2e-gate-2-shard-2:
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-e2e
        with:
          args: --gate 2 --additions --shard 2/2

  e2e-gate-2:
    needs: [e2e-gate-2-shard-1, e2e-gate-2-shard-2]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require gate 2 shards to succeed
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success
          done

  required:
    needs: [lint-x86-vm, lint-arm64, lint, linux-x86_64, cross, macos, linux-arm64, e2e-gate-1, e2e-gate-2-shard-1, e2e-gate-2-shard-2, e2e-gate-2]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Check required job coverage
        run: tools/check-required-jobs.sh
      - name: Require all jobs to succeed
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            test "$result" = success
          done
