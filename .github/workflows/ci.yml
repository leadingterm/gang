name: CI

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -euo pipefail {0}

jobs:
  # Private Linux jobs use RunsOn (4 CPU/16 GB); public labels remain free standard runners.
  nix-vm:
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/family=m8i/image=ubuntu24-full-x64/nested-virt', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          kvm: 'true'
          cache-save: 'true'
      - uses: ./.github/actions/setup-bazel
        with:
          cache-job: linux-x86_64
          restore-only: 'true'
      - name: Run NixOS VM checks
        env:
          NIX_CHECK_RESULTS: ${{ runner.temp }}/nix-check-results
        run: tools/lint.sh --nix-vm

  lint-checks:
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
        with:
          cache-job: linux-x86_64
          restore-only: 'true'
      - name: Lint
        # Portable lint includes the real Git/Bazel selector regression fixtures.
        timeout-minutes: 5
        run: tools/lint.sh --portable
      - name: Export the Bazel working set
        uses: ./.github/actions/save-bazel-cache
        with:
          mode: export
          shard: x86-lint
          prune: 'true'

  linux-x86_64-shards:
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
        with:
          cache-job: linux-x86_64
          restore-only: 'true'
      - name: Select shard targets
        env:
          SHARD: ${{ matrix.shard }}
        run: tools/ci-targets.sh --query | tools/ci-targets.sh "$SHARD" 4 > "$RUNNER_TEMP/targets"
      - name: Test
        timeout-minutes: 55
        run: bazel test --skip_incompatible_explicit_targets --target_pattern_file="$RUNNER_TEMP/targets" --build_event_json_file="$RUNNER_TEMP/bazel-test.bep.json" --profile="$RUNNER_TEMP/bazel-test.profile.gz"
      - name: Export the Bazel working set
        if: always() && job.status == 'success'
        uses: ./.github/actions/save-bazel-cache
        with:
          mode: export
          shard: x86-${{ matrix.shard }}
          prune: ${{ job.status == 'success' }}

  linux-x86_64-bundle:
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
        with:
          cache-job: linux-x86_64
          restore-only: 'true'
      - name: Check remote action shell environment
        run: tools/check-action-shell.sh
      - name: Build gang and e2e harness
        timeout-minutes: 50
        # Cache hits materialize only top-level outputs; upload-gang needs //:gang outside the bundle.
        run: bazel build --build_event_json_file="$RUNNER_TEMP/bazel-build.bep.json" --profile="$RUNNER_TEMP/bazel-build.profile.gz" //:gang //crates/gang-e2e:bundle
      - uses: ./.github/actions/upload-gang
        with:
          target: x86_64-unknown-linux-musl
      - name: Collect the e2e harness
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cp $(bazel cquery --output=files //crates/gang-e2e:bundle) "$RUNNER_TEMP/e2e/"
          files=$(jq -er '
            if .v035 == {"binary":"gang-v035","fixture":"deployment-v035.json"} then
              [.previous.binary, .previous.fixture, .v035.binary, .v035.fixture, .candidate_fixture] |
              if all(.[]; if type == "string" then test("^[A-Za-z0-9][A-Za-z0-9._-]*$") else false end)
              then .[] else error("invalid upgrade bundle manifest") end
            else error("invalid v035 upgrade pair") end
          ' "$RUNNER_TEMP/e2e/upgrade-inputs.json")
          readarray -t files <<< "$files"
          for file in "${files[@]}"; do
            test -f "$RUNNER_TEMP/e2e/$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-harness-x86_64
          path: ${{ runner.temp }}/e2e
          if-no-files-found: error
      # The four test shards already build the binary and harness; their exports plus lint
      # cover the used inputs without delaying E2E on a redundant bundle export.
      - name: Upload bundle build metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-metrics-x86-bundle
          path: |
            ${{ runner.temp }}/bazel-build.bep.json
            ${{ runner.temp }}/bazel-build.profile.gz
          retention-days: 7

  cross-build:
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-arm64/ram=16/image=ubuntu24-full-arm64', github.run_id) || 'ubuntu-24.04-arm' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Cross-build gang
        timeout-minutes: 45
        run: bazel build --build_event_json_file="$RUNNER_TEMP/bazel-cross.bep.json" --profile="$RUNNER_TEMP/bazel-cross.profile.gz" --platforms=@zig_sdk//libc_aware/platform:linux_amd64_musl //:gang

  macos:
    # RunsOn does not support macOS; public queue CI runs this advisory job.
    if: github.event_name == 'merge_group' && !github.event.repository.private
    runs-on: macos-15
    timeout-minutes: 75
    env:
      MACOS_TEST_TARGETS: >-
        //crates/gang-client/... //crates/gang-e2e/... //crates/gang-exec/...
        //crates/gang-os/... //crates/gang-testkit/... //crates/gang-local/...
        //crates/gang-worker/... //crates/gang-noop/... //crates/gang-aws/...
        //crates/gang-cgroup/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Check all Darwin Cargo targets
        run: nix run .#darwin-check
      - name: Build
        timeout-minutes: 60
        run: |
          read -r -a targets <<< "$MACOS_TEST_TARGETS"
          bazel build --build_event_json_file="$RUNNER_TEMP/bazel-darwin-build.bep.json" --profile="$RUNNER_TEMP/bazel-darwin-build.profile.gz" //:gang "${targets[@]}"
      - uses: ./.github/actions/upload-gang
        with:
          target: aarch64-apple-darwin
      - name: Test the macOS-specific crates
        timeout-minutes: 10
        run: |
          read -r -a targets <<< "$MACOS_TEST_TARGETS"
          bazel test --build_event_json_file="$RUNNER_TEMP/bazel-darwin-test.bep.json" --profile="$RUNNER_TEMP/bazel-darwin-test.profile.gz" "${targets[@]}"

  linux-arm64-bundle:
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-arm64/ram=16/image=ubuntu24-full-arm64', github.run_id) || 'ubuntu-24.04-arm' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Check remote action shell environment
        run: tools/check-action-shell.sh
      - name: Build gang and e2e harness
        timeout-minutes: 50
        run: bazel build --build_event_json_file="$RUNNER_TEMP/bazel-build.bep.json" --profile="$RUNNER_TEMP/bazel-build.profile.gz" //:gang //crates/gang-e2e:bundle
      - uses: ./.github/actions/upload-gang
        with:
          target: aarch64-unknown-linux-musl
      - name: Collect the e2e harness
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cp $(bazel cquery --output=files //crates/gang-e2e:bundle) "$RUNNER_TEMP/e2e/"
          files=$(jq -er '
            if .v035 == {"binary":"gang-v035","fixture":"deployment-v035.json"} then
              [.previous.binary, .previous.fixture, .v035.binary, .v035.fixture, .candidate_fixture] |
              if all(.[]; if type == "string" then test("^[A-Za-z0-9][A-Za-z0-9._-]*$") else false end)
              then .[] else error("invalid upgrade bundle manifest") end
            else error("invalid v035 upgrade pair") end
          ' "$RUNNER_TEMP/e2e/upgrade-inputs.json")
          readarray -t files <<< "$files"
          for file in "${files[@]}"; do
            test -f "$RUNNER_TEMP/e2e/$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-harness-aarch64
          path: ${{ runner.temp }}/e2e
          if-no-files-found: error

  linux-arm64-checks:
    needs: [linux-arm64-bundle]
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-arm64/ram=16/image=ubuntu24-full-arm64', github.run_id) || 'ubuntu-24.04-arm' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Check BUILD files are in sync
        run: bazel run //:gazelle.check
      # Native ELF, shell/signal and PostgreSQL boundaries complement the full x86 suite (docs/SPECIFICATION.md §7).
      - name: Test
        # Allow 1.5x the observed cold ARM bundle build for compilation.
        timeout-minutes: 40
        run: >-
          bazel test --build_event_json_file="$RUNNER_TEMP/bazel-test.bep.json" --profile="$RUNNER_TEMP/bazel-test.profile.gz"
          //crates/gang-main:gang_main_integration_tests_tests/static_binary_test
          //crates/gang-e2e:gang_e2e_integration_tests_tests/hold_signal_test
          //crates/gang-postgres:gang_postgres_integration_tests_tests/tls_test
          //crates/gang-postgres:gang_postgres_integration_tests_tests/contract_test
          //crates/gang-postgres:gang_postgres_integration_tests_tests/plugin_test
          //crates/gang-testkit:gang_testkit_integration_tests_tests/postgres_test

  e2e-gate-1-shards:
    needs: [linux-x86_64-bundle]
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    # The script bounds the gate itself; this timeout is only an outer backstop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-e2e
        with:
          args: --gate 1 --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  e2e-gate-2-shards:
    needs: [linux-x86_64-bundle]
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-e2e
        with:
          args: --gate 2 --additions --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  e2e-v035-upgrade:
    needs: [linux-x86_64-bundle]
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/run-e2e
        with:
          args: --gate 2 --scenario rolling-upgrade --previous-gang ${{ runner.temp }}/e2e/gang-v035 --previous-fixture ${{ runner.temp }}/e2e/deployment-v035.json

  release-validation:
    # macOS remains advisory and is not a release prerequisite.
    needs: [nix-vm, lint-checks, linux-x86_64-shards, linux-x86_64-bundle, linux-arm64-bundle, linux-arm64-checks, cross-build, e2e-gate-1-shards, e2e-gate-2-shards, e2e-v035-upgrade]
    if: always() && github.event_name == 'merge_group'
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Require every full validation job
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$NEEDS_RESULTS"
          test "${#results[@]}" -eq 10
          for result in "${results[@]}"; do
            test "$result" = success
          done

  readiness:
    name: ${{ matrix.check }}
    needs: [release-validation]
    if: always() && github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        check: [lint, cross, linux-x86_64, linux-arm64, e2e-gate-1, e2e-gate-2]
    runs-on: ${{ github.event.repository.private && format('runs-on={0}/runner=4cpu-linux-x64/ram=16/image=ubuntu24-full-x64', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Require full queue validation
        shell: bash
        env:
          RESULT: ${{ needs.release-validation.result }}
        run: test "$RESULT" = success
