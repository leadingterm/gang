name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop -c bash --noprofile --norc -euo pipefail {0}

jobs:
  # Every job is a required check (docs/SPECIFICATION.md 7.1). Timeouts are about twice the slowest
  # measured cold run; the step timeouts of the long Bazel steps leave the cache save room inside the job's.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Check Nix formatting
        run: alejandra --check .
      - name: Lint scripts
        run: shellcheck infra/scripts/*.sh
      - name: Lint workflows
        run: actionlint
      - name: Evaluate every flake output of every system
        run: nix flake check --no-build --all-systems

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Check BUILD files are in sync
        run: bazel run //:gazelle.check
      - name: Test
        timeout-minutes: 55
        run: bazel test //...
      - uses: ./.github/actions/upload-gang
        with:
          target: x86_64-unknown-linux-musl
      - name: Collect the e2e harness
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cp $(bazel cquery --output=files //crates/gang-e2e:bundle) "$RUNNER_TEMP/e2e/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-harness
          path: ${{ runner.temp }}/e2e
          if-no-files-found: error
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Cross-build gang
        timeout-minutes: 45
        run: bazel build --platforms=@zig_sdk//libc_aware/platform:linux_arm64_musl //:gang
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  macos:
    runs-on: macos-15
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Build
        timeout-minutes: 130
        run: bazel build //...
      - uses: ./.github/actions/upload-gang
        with:
          target: aarch64-apple-darwin
      - name: Test the macOS-specific crates
        timeout-minutes: 10
        run: bazel test //crates/gang-exec/... //crates/gang-noop/...
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-bazel
      - name: Test
        timeout-minutes: 60
        run: bazel test //...
      - uses: ./.github/actions/upload-gang
        with:
          target: aarch64-unknown-linux-musl
      - name: Save the Bazel disk cache
        if: always()
        uses: ./.github/actions/save-bazel-cache
        with:
          prune: ${{ job.status == 'success' }}

  e2e:
    name: e2e-gate-${{ matrix.gate }}
    needs: linux-x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: 1
            args: --gate 1
          - gate: 2
            args: --gate 2 --additions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-harness
          path: ${{ runner.temp }}/e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gang-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/e2e
      - name: Delegate cgroup controllers to the user session
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=yes\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -u)"
          sudo systemctl restart "user@$(id -u).service"
          sudo systemctl start "user@$(id -u).service"
      # Workers use systemd-run --user --scope and need the runner's delegated user manager. The unit
      # starts from the user manager's environment, so it enters the devShell itself. Artifacts drop
      # file modes; ARGS splits into the harness's arguments.
      - name: Run the gate
        env:
          ARGS: ${{ matrix.args }}
          E2E: ${{ runner.temp }}/e2e
        run: |
          chmod +x "$E2E"/*
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --pipe --wait --same-dir -p Delegate=yes --setenv=PATH="$PATH" --setenv=GANG_E2E_GLIBC_TOOL="$E2E/loaded_probe" -- nix develop -c "$E2E/local" --gang "$E2E/gang-x86_64-unknown-linux-musl" --bazel "$E2E/bazel" --config configs/gang.local.toml --sample e2e/sample --configs configs $ARGS
