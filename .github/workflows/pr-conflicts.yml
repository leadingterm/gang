name: PR conflict diagnostics

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pr-conflicts-${{ github.repository }}
  cancel-in-progress: true

jobs:
  conflicts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          BASE: ${{ github.sha }}
        run: python3 tools/pr_conflicts.py --base "$BASE"
