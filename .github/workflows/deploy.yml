# Reusable deploy pipeline for one OpenTofu root: plans reviewed pull requests and applies merged plans on main.
#
# Call it from a job in the caller repository, pinned to a Gang tag:
#
#   jobs:
#     deploy:
#       uses: <owner>/gang/.github/workflows/deploy.yml@<tag>
#       with:
#         root: infra
#         plan_role_arn: arn:aws:iam::000000000000:role/example-plan
#         apply_role_arn: arn:aws:iam::000000000000:role/example-apply
#         state_bucket: example-state
#         state_key: infra/terraform.tfstate
#         state_region: us-east-1
#         kms_key_arn: arn:aws:kms:us-east-1:000000000000:key/example
#         plan_bucket: example-plans
#         plan_prefix: plans
#         gang_sha256: <SHA-256 of gang-x86_64-unknown-linux-musl, from the release's SHA256SUMS>
#       permissions:
#         contents: read
#         id-token: write
#         pull-requests: write
#         actions: read
#
# One call per repository; the manifest, comment marker and plan key do not name a root.
# The specification (docs/SPECIFICATION.md 8.5) describes the plan and apply jobs.

name: Deploy

on:
  workflow_call:
    inputs:
      root:
        description: "Directory of the OpenTofu root in the caller's repository."
        required: true
        type: string
      plan_role_arn:
        description: "IAM role the plan job assumes through the job's identity token."
        required: true
        type: string
      apply_role_arn:
        description: "IAM role the apply job assumes through the job's identity token."
        required: true
        type: string
      state_bucket:
        description: "S3 bucket of the OpenTofu state."
        required: true
        type: string
      state_key:
        description: "Key of the OpenTofu state object in state_bucket."
        required: true
        type: string
      state_region:
        description: "AWS region of the state bucket and of the jobs' AWS credentials."
        required: true
        type: string
      kms_key_arn:
        description: "KMS key that encrypts the state and the stored plans."
        required: true
        type: string
      plan_bucket:
        description: "S3 bucket of the reviewed-plan store."
        required: true
        type: string
      plan_prefix:
        description: "Key prefix of the stored plans in plan_bucket; a trailing / is trimmed."
        required: true
        type: string
      gang_sha256:
        description: "SHA-256 of the release asset gang-<arch>-unknown-linux-musl for the runner's architecture, from the release's SHA256SUMS."
        required: true
        type: string
      apply_environment:
        description: "GitHub environment of the apply job."
        type: string
        default: production
      plan_max_age:
        description: "How long a stored plan stays usable, as a duration such as 24h or 90m (units ms, s, m, h, d)."
        type: string
        default: 24h
      lock_timeout:
        description: "How long apply and the convergence plan wait for another run to release the state lock, as an OpenTofu duration (-lock-timeout)."
        type: string
        default: 4m
      runner:
        description: "Runner label of every job."
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

# Every run step executes inside the deploy dev shell. That shell exists only after the checkout
# and nix-install steps of each job, which therefore stay as plain steps: a composite action
# cannot carry them, because a local action resolves only after the Gang checkout it would perform.
defaults:
  run:
    shell: nix develop ./.gang#deploy -c bash -euo pipefail {0}

# Pull request runs of one PR replace each other; main runs are serialised by the apply job alone.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  ROOT: ${{ inputs.root }}
  INFRA_STATE_BUCKET: ${{ inputs.state_bucket }}
  INFRA_STATE_KEY: ${{ inputs.state_key }}
  INFRA_STATE_REGION: ${{ inputs.state_region }}
  INFRA_STATE_KMS_KEY_ARN: ${{ inputs.kms_key_arn }}
  INFRA_PLAN_BUCKET: ${{ inputs.plan_bucket }}
  INFRA_PLAN_PREFIX: ${{ inputs.plan_prefix }}
  INFRA_PLAN_MAX_AGE: ${{ inputs.plan_max_age }}
  INFRA_LOCK_TIMEOUT: ${{ inputs.lock_timeout }}
  GANG_SHA256: ${{ inputs.gang_sha256 }}

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gang
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Validate the OpenTofu root
        run: .gang/infra/scripts/reviewed-plan.sh validate

  plan:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gang
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Install gang
        env:
          GH_TOKEN: ${{ github.token }}
          GANG_REPOSITORY: ${{ job.workflow_repository }}
          GANG_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: .gang/infra/scripts/install-gang.sh
      - name: Assume plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ inputs.plan_role_arn }}
          aws-region: ${{ inputs.state_region }}
          role-session-name: deploy-plan-${{ github.run_id }}
      - name: Initialise backend
        run: .gang/infra/scripts/reviewed-plan.sh init
      - name: Plan
        id: plan
        run: .gang/infra/scripts/reviewed-plan.sh plan
      - name: Store reviewed plan
        if: always() && steps.plan.outputs.blocked == 'false'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .gang/infra/scripts/reviewed-plan.sh store
      - name: Publish plan comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .gang/infra/scripts/reviewed-plan.sh publish

  apply:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.apply_environment }}
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    concurrency:
      group: deploy-apply-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gang
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Install gang
        env:
          GH_TOKEN: ${{ github.token }}
          GANG_REPOSITORY: ${{ job.workflow_repository }}
          GANG_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: .gang/infra/scripts/install-gang.sh
      - name: Resolve reviewed plan
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: .gang/infra/scripts/reviewed-plan.sh resolve
      - name: Assume apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ inputs.apply_role_arn }}
          aws-region: ${{ inputs.state_region }}
          role-session-name: deploy-apply-${{ github.run_id }}
      - name: Initialise backend
        run: .gang/infra/scripts/reviewed-plan.sh init
      - name: Fetch reviewed plan
        run: .gang/infra/scripts/reviewed-plan.sh fetch
      - name: Verify reviewed plan
        id: verify
        run: .gang/infra/scripts/reviewed-plan.sh verify
      - name: Apply reviewed plan
        env:
          HAS_CHANGES: ${{ steps.verify.outputs.has_changes }}
        run: .gang/infra/scripts/reviewed-plan.sh apply
      - name: Confirm convergence
        run: .gang/infra/scripts/reviewed-plan.sh converge
      - name: Restart controller on configuration change
        run: .gang/infra/scripts/reviewed-plan.sh restart
